name: Deploy

permissions:
  id-token: write
  contents: read

on:
  push:
    branches: [ "dev", "main", "deploy" ]
  workflow_dispatch:

env:
  IMAGE: ${{ vars.GAR_LOCATION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GAR_REPOSITORY }}/${{ vars.SERVICE_NAME }}

jobs:
  validate:
    name: Validate Variables
    runs-on: ubuntu-latest
    steps:
      - name: Check required variables
        env:
          SECRET_VM_HOST: ${{ secrets.VM_HOST }}
          SECRET_VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
          SECRET_GCP_PROJECT_NUMBER: ${{ secrets.GCP_PROJECT_NUMBER }}
          SECRET_TRUST_STORE_PASSWORD: ${{ secrets.TRUST_STORE_PASSWORD }}
          SECRET_KEYCLOAK_CLIENT_SECRET: ${{ secrets.KEYCLOAK_CLIENT_SECRET }}
          SECRET_KEYCLOAK_ADMIN_USERNAME: ${{ secrets.KEYCLOAK_ADMIN_USERNAME }}
          SECRET_KEYCLOAK_ADMIN_PASSWORD: ${{ secrets.KEYCLOAK_ADMIN_PASSWORD }}
        run: |
          echo "=== Variables ==="
          echo "GAR_LOCATION     : ${{ vars.GAR_LOCATION }}"
          echo "GCP_PROJECT_ID   : ${{ vars.GCP_PROJECT_ID }}"
          echo "GCP_SA_EMAIL      : ${{ vars.GCP_SA_EMAIL }}"
          echo "GAR_REPOSITORY   : ${{ vars.GAR_REPOSITORY }}"
          echo "SERVICE_NAME     : ${{ vars.SERVICE_NAME }}"
          echo "VM_USER          : ${{ vars.VM_USER }}"
          echo "VM_SSH_PORT      : ${{ vars.VM_SSH_PORT }}"
          echo "APP_DIR          : ${{ vars.APP_DIR }}"
          echo "HEALTH_CHECK_PORT: ${{ vars.HEALTH_CHECK_PORT }}"
          echo ""
          echo "=== Secrets (존재 여부만 확인) ==="
          [ -n "$SECRET_VM_HOST"             ] && echo "VM_HOST             : ✅" || echo "VM_HOST             : ❌ 누락"
          [ -n "$SECRET_VM_SSH_KEY"          ] && echo "VM_SSH_KEY          : ✅" || echo "VM_SSH_KEY          : ❌ 누락"
          [ -n "$SECRET_GCP_PROJECT_NUMBER"  ] && echo "GCP_PROJECT_NUMBER  : ✅" || echo "GCP_PROJECT_NUMBER  : ❌ 누락"
          [ -n "$SECRET_TRUST_STORE_PASSWORD"   ] && echo "TRUST_STORE_PASSWORD   : ✅" || echo "TRUST_STORE_PASSWORD   : ❌ 누락"
          [ -n "$SECRET_KEYCLOAK_CLIENT_SECRET"  ] && echo "KEYCLOAK_CLIENT_SECRET : ✅" || echo "KEYCLOAK_CLIENT_SECRET : ❌ 누락"
          [ -n "$SECRET_KEYCLOAK_ADMIN_USERNAME" ] && echo "KEYCLOAK_ADMIN_USERNAME: ✅" || echo "KEYCLOAK_ADMIN_USERNAME: ❌ 누락"
          [ -n "$SECRET_KEYCLOAK_ADMIN_PASSWORD" ] && echo "KEYCLOAK_ADMIN_PASSWORD: ✅" || echo "KEYCLOAK_ADMIN_PASSWORD: ❌ 누락"
          echo ""

          MISSING=()
          [ -z "${{ vars.GAR_LOCATION }}"      ] && MISSING+=("vars.GAR_LOCATION")
          [ -z "${{ vars.GCP_PROJECT_ID }}"    ] && MISSING+=("vars.GCP_PROJECT_ID")
          [ -z "${{ vars.GCP_SA_EMAIL }}"       ] && MISSING+=("vars.GCP_SA_EMAIL")
          [ -z "${{ vars.GAR_REPOSITORY }}"    ] && MISSING+=("vars.GAR_REPOSITORY")
          [ -z "${{ vars.SERVICE_NAME }}"      ] && MISSING+=("vars.SERVICE_NAME")
          [ -z "${{ vars.VM_USER }}"           ] && MISSING+=("vars.VM_USER")
          [ -z "${{ vars.VM_SSH_PORT }}"       ] && MISSING+=("vars.VM_SSH_PORT")
          [ -z "${{ vars.APP_DIR }}"           ] && MISSING+=("vars.APP_DIR")
          [ -z "${{ vars.HEALTH_CHECK_PORT }}" ] && MISSING+=("vars.HEALTH_CHECK_PORT")
          [ -z "$SECRET_VM_HOST"               ] && MISSING+=("secrets.VM_HOST")
          [ -z "$SECRET_VM_SSH_KEY"            ] && MISSING+=("secrets.VM_SSH_KEY")
          [ -z "$SECRET_GCP_PROJECT_NUMBER"    ] && MISSING+=("secrets.GCP_PROJECT_NUMBER")
          [ -z "$SECRET_TRUST_STORE_PASSWORD"   ] && MISSING+=("secrets.TRUST_STORE_PASSWORD")
          [ -z "$SECRET_KEYCLOAK_CLIENT_SECRET"  ] && MISSING+=("secrets.KEYCLOAK_CLIENT_SECRET")
          [ -z "$SECRET_KEYCLOAK_ADMIN_USERNAME" ] && MISSING+=("secrets.KEYCLOAK_ADMIN_USERNAME")
          [ -z "$SECRET_KEYCLOAK_ADMIN_PASSWORD" ] && MISSING+=("secrets.KEYCLOAK_ADMIN_PASSWORD")

          if [ ${#MISSING[@]} -gt 0 ]; then
            echo "=== 누락된 변수 ==="
            for var in "${MISSING[@]}"; do
              echo "  ❌ $var"
            done
            exit 1
          fi

          echo "=== 모든 변수 확인 완료 ✅ ==="

  test:
    name: Test
    needs: validate
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: goggles
          POSTGRES_USER: goggles
          POSTGRES_PASSWORD: goggles
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Run tests
        run: |
          chmod +x ./gradlew
          ./gradlew test \
            -PGitHubPackagesUsername=${{ github.actor }} \
            -PGitHubPackagesPassword=${{ secrets.GITHUB_TOKEN }}

  build-and-push:
    name: Build & Push
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Build JAR
        run: |
          chmod +x ./gradlew
          ./gradlew bootJar -x test \
            -PGitHubPackagesUsername=${{ github.actor }} \
            -PGitHubPackagesPassword=${{ secrets.GITHUB_TOKEN }}

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/${{ secrets.GCP_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/github-pool/providers/github-provider-v2
          service_account: ${{ vars.GCP_SA_EMAIL }}
          project_id: ${{ vars.GCP_PROJECT_ID }}


      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker ${{ vars.GAR_LOCATION }}-docker.pkg.dev --quiet
          

      - name: Build and push image
        run: |
          LATEST_TAG=$([[ "${{ github.ref_name }}" == "main" ]] && echo "latest-main" || echo "latest-dev")
          docker build -t $IMAGE:${{ github.sha }} -t $IMAGE:${LATEST_TAG} .
          docker push $IMAGE:${{ github.sha }}
          docker push $IMAGE:${LATEST_TAG}

  deploy:
    name: Deploy
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/${{ secrets.GCP_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/github-pool/providers/github-provider-v2
          service_account: ${{ vars.GCP_SA_EMAIL }}
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Set up gcloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Set compose file
        id: vars
        run: |
          if [ "${{ github.ref_name }}" = "main" ] && [ -f "docker-compose.prod.yml" ]; then
            echo "compose=docker-compose.prod.yml" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref_name }}" != "main" ] && [ -f "docker-compose.dev.yml" ]; then
            echo "compose=docker-compose.dev.yml" >> $GITHUB_OUTPUT
          else
            echo "compose=docker-compose.yml" >> $GITHUB_OUTPUT
          fi

      - name: Prepare .env and deploy script
        run: |
          cat > /tmp/.env.new << EOF
          IMAGE=${{ env.IMAGE }}
          IMAGE_TAG=${{ github.sha }}
          SPRING_DATASOURCE_URL=jdbc:postgresql://${{ secrets.DB_URL }}/user_db
          DB_USERNAME=${{ secrets.DB_USERNAME }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://${{ secrets.VM_INTERNAL_HOST }}:9001/eureka/
          KAFKA_BOOTSTRAP_SERVERS=${{ secrets.KAFKA_1_INTERNAL_IP }}:9092,${{ secrets.KAFKA_2_INTERNAL_IP }}:9092,${{ secrets.KAFKA_3_INTERNAL_IP }}:9092
          TRUST_STORE_PASSWORD=${{ secrets.TRUST_STORE_PASSWORD }}
          MONITORING_HOST=${{ secrets.MONITORING_VM_HOST }}
          KEYCLOAK_CLIENT_SECRET=${{ secrets.KEYCLOAK_CLIENT_SECRET }}
          KEYCLOAK_ADMIN_USERNAME=${{ secrets.KEYCLOAK_ADMIN_USERNAME }}
          KEYCLOAK_ADMIN_PASSWORD=${{ secrets.KEYCLOAK_ADMIN_PASSWORD }}
          EOF

          cat > /tmp/deploy.sh << 'SCRIPT'
          set -e
          APP_DIR="$1"
          SERVICE="$2"
          HEALTH_PORT="$3"
          COMPOSE_FILE="$APP_DIR/$4"
          ENV_FILE="$APP_DIR/.env"

          cd $APP_DIR

          PREV_TAG=$(grep '^IMAGE_TAG=' "$ENV_FILE" 2>/dev/null | cut -d= -f2)
          echo "Previous: ${PREV_TAG:-(없음)} → New: $(grep '^IMAGE_TAG=' "$ENV_FILE.new" | cut -d= -f2)"

          mv "$ENV_FILE.new" "$ENV_FILE"
          sed -i '/^SPRING_CLOUD_CONFIG_URI=/d' "$ENV_FILE"

          if [ ! -f "/home/deploy/ssl/kafka.truststore.jks" ]; then
            echo "[SSL] ❌ /home/deploy/ssl/kafka.truststore.jks 없음"
            exit 1
          fi

          docker compose --env-file $ENV_FILE -f $COMPOSE_FILE up -d keycloak
          docker compose --env-file $ENV_FILE -f $COMPOSE_FILE pull $SERVICE
          docker compose --env-file $ENV_FILE -f $COMPOSE_FILE up -d $SERVICE

          echo "Health check 시작... (port: $HEALTH_PORT)"
          for i in $(seq 1 8); do
            sleep 30
            if curl -sf "http://localhost:$HEALTH_PORT/actuator/health" > /dev/null; then
              echo "Health check 통과 (시도 $i)"
              exit 0
            fi
            echo "Health check 실패 ($i/8)"
          done

          [ -z "$PREV_TAG" ] && echo "이전 태그 없음 — 롤백 불가" && exit 1
          echo "배포 실패 — $PREV_TAG 로 롤백..."
          sed -i "s|^IMAGE_TAG=.*|IMAGE_TAG=$PREV_TAG|" "$ENV_FILE"
          docker compose --env-file $ENV_FILE -f $COMPOSE_FILE up -d $SERVICE
          sleep 30
          curl -sf "http://localhost:$HEALTH_PORT/actuator/health" > /dev/null && echo "롤백 성공" || echo "롤백도 실패"
          exit 1
          SCRIPT

      - name: Copy files to VM
        run: |
          gcloud compute ssh ${{ vars.VM_USER }}@service-vm \
            --zone=asia-northeast3-a \
            --tunnel-through-iap \
            --command="mkdir -p ${{ vars.APP_DIR }}/${{ vars.SERVICE_NAME }}"
          gcloud compute scp /tmp/.env.new /tmp/deploy.sh ${{ steps.vars.outputs.compose }} \
            ${{ vars.VM_USER }}@service-vm:${{ vars.APP_DIR }}/${{ vars.SERVICE_NAME }}/ \
            --zone=asia-northeast3-a \
            --tunnel-through-iap

      - name: Deploy to VM
        run: |
          gcloud compute ssh ${{ vars.VM_USER }}@service-vm \
            --zone=asia-northeast3-a \
            --tunnel-through-iap \
            --command="bash ${{ vars.APP_DIR }}/${{ vars.SERVICE_NAME }}/deploy.sh \
              '${{ vars.APP_DIR }}/${{ vars.SERVICE_NAME }}' \
              '${{ vars.SERVICE_NAME }}' \
              '${{ vars.HEALTH_CHECK_PORT }}' \
              '${{ steps.vars.outputs.compose }}'"
