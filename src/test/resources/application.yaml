spring:
  application:
    name: user-service

  config:
    import:
      - "optional:file:.env[.properties]"

  # Config 서버 비활성화
  cloud:
    config:
      enabled: false
      discovery:
        enabled: false

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:goggles}
    username: ${DB_USERNAME:goggles}
    password: ${DB_PASSWORD:goggles}
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: false

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: "http://localhost:9090/realms/goggles/protocol/openid-connect/certs"
          issuer-uri: "http://localhost:9090/realms/goggles"

keycloak:
  server-url: "http://localhost:9090"
  realm: goggles
  client-id: user-service
  client-secret: ${KEYCLOAK_CLIENT_SECRET:dummy-secret}
  admin-username: ${KEYCLOAK_ADMIN_USERNAME:dummy-admin}
  admin-password: ${KEYCLOAK_ADMIN_PASSWORD:dummy-password}

# Eureka 비활성화
eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false

server:
  port: 9010