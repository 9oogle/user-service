spring:
  application:
    name: user-service

  profiles:
    active: ${SPRING_PROFILES_ACTIVE}
  config:
    import: "optional:configserver:${CONFIG_SERVER_URL}"
  cloud:
    config:
      discovery:
        enabled: true
        service-id: config-server

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:9013}/${DB_NAME:goggles}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true          # SQL 보기 좋게 포맷
        dialect: org.hibernate.dialect.PostgreSQLDialect  # 명시 추천
eureka:
  instance:
    prefer-ip-address : false  # 서비스가 Eureka에 등록될 때 IP 대신 hostname으로 등록 false = hostname 사용, true = IP 사용
    hostname: ${HOSTNAME:localhost} # 등록할 hostname. 환경변수 HOSTNAME이 있으면 그 값, 없으면 localhost
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://${EUREKA_SERVER_URL1:localhost}:9001/eureka/,
        http://${EUREKA_SERVER_URL2:localhost}:9002/eureka/