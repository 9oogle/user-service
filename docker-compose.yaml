services:
  db:
    image: postgres:17
    container_name: goggles-user
    ports:
      - "9013:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    networks:
      - goggles-network
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:

networks:
  goggles-network:
    name: goggles-network
    driver: bridge